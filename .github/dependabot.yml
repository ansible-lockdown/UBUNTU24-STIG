---

version: 2

updates:
  # GitHub Actions used by this repo's workflows.
  #
  # Grouped into a single pull request on purpose: every pull request here runs the
  # molecule scenario plus the self-hosted pipeline that provisions and destroys real
  # infrastructure, so one batched PR a month is far cheaper than one per action.
  #
  # Note that the actions referenced by branch rather than by version - the AWS
  # credentials action, first-interaction, and the shared reusable workflows - cannot be
  # tracked here. Dependabot only resolves version-like refs, so those still need
  # reviewing by hand.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
