---

name: Molecule

on:  # yamllint disable-line rule:truthy
  # Branch lists cover both repository models so this file needs no edit when it is
  # overlaid to the public mirror, matching the convention the pipeline workflows already
  # use: the private role has `latest` and `benchmark_*`, the public mirror has `devel`
  # and `main`.
  push:
    branches:
      - main
      - latest
    paths:
      - 'defaults/**'
      - 'handlers/**'
      - 'tasks/**'
      - 'templates/**'
      - 'vars/**'
      - 'molecule/**'
      - 'collections/**'
      - 'site.yml'
      - '.github/workflows/molecule.yml'
  pull_request:
    branches:
      - latest
      - benchmark*
      - devel
      - main
    paths:
      - 'defaults/**'
      - 'handlers/**'
      - 'tasks/**'
      - 'templates/**'
      - 'vars/**'
      - 'molecule/**'
      - 'collections/**'
      - 'site.yml'
      - '.github/workflows/molecule.yml'
  # collections/requirements.yml sets only minimum collection versions, and the test image tracks
  # the moving `latest` tag, so the substrate shifts underneath this suite between commits. A
  # weekly run surfaces that drift as its own red build rather than as a
  # mystery failure on whatever unrelated PR is open at the time.
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual running of workflow
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  molecule:
    # Container-based smoke test on GitHub-hosted runners. This does not replace the tofu/EC2
    # pipelines - it is the fast, secret-free gate that runs in front of them. One scenario only:
    # the role targets a single distribution, so there is no second image whose package set would
    # exercise paths `default` misses.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
      # Overrides the linux/arm64 default in molecule.yml - GitHub-hosted runners are amd64.
      MOLECULE_DOCKER_PLATFORM: linux/amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the Python that Ubuntu 24.04 ships on the managed node.
          python-version: "3.12"

      - name: Install Ansible, Molecule, and the docker driver
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.19" "molecule>=25.0" "molecule-plugins[docker]" docker
          ansible --version

      # The molecule docker driver requires community.docker and ansible.posix, and
      # collections/requirements.yml (installed by molecule's own dependency step) does not carry
      # community.docker. ansible-core ships no bundled collections, so install both here or
      # `molecule create` fails before it reaches the role.
      - name: Install collections required by the molecule docker driver
        run: ansible-galaxy collection install community.docker ansible.posix

      - name: Create container
        run: molecule create -s default

      - name: Converge
        run: |
          molecule converge -s default -- \
            --extra-vars 'audit_output_destination=${{ github.workspace }}/molecule_audit_output/'

      # Converge #2 changes nothing once the audit scans, the audit fetch and the two facts
      # templates are excluded with the molecule-idempotence-notest tag: each of those writes a
      # timestamp or a fresh scan result on every run by design. Any other change is a regression.
      - name: Idempotence
        run: molecule idempotence -s default

      - name: Verify
        run: molecule verify -s default

      # Audit results are published for inspection, not used as a gate: post-scan failures are
      # expected in a container (SSH, user-state, kernel and mount controls). The real gate is
      # converge finishing failed=0; verify.yml is a narrow regression check on top of that.
      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: molecule-audit-default
          path: molecule_audit_output/
          if-no-files-found: ignore

      # Guarded on molecule being present: when an earlier step fails before molecule is
      # installed, an unguarded destroy exits 127 and that misleading error is what surfaces instead
      # of the real one.
      - name: Destroy container
        if: always()
        run: |
          if command -v molecule >/dev/null 2>&1; then
            molecule destroy -s default
          else
            echo "molecule was never installed; nothing to destroy."
          fi
