---

- name: Systemd_daemon_reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Change_requires_reboot
  ansible.builtin.set_fact:
    reboot_required: true

- name: Update_grub
  ansible.builtin.command: update-grub
  changed_when: true
  failed_when: false

- name: Restart_ssh
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted

- name: Restart_chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

- name: Restart_sssd
  ansible.builtin.systemd_service:
    name: sssd
    state: restarted
  when: "'sssd' in ansible_facts['packages']"

- name: Update_dconf
  ansible.builtin.command: dconf update
  changed_when: true
  failed_when: false

- name: Restart_gdm3
  ansible.builtin.systemd_service:
    name: gdm3
    state: restarted

- name: Restart_rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: restarted

## Auditd tasks note order for handlers to run

- name: Auditd_immutable_check
  when: not system_is_container
  ansible.builtin.command: grep -c "^-e 2" /etc/audit/rules.d/audit.rules
  changed_when: false
  failed_when: discovered_auditd_immutable_check.rc not in [ 0, 1 ]
  register: discovered_auditd_immutable_check

- name: Audit_immutable_fact
  when:
    - not system_is_container
    - discovered_auditd_immutable_check.stdout == '1'
  ansible.builtin.debug:
    msg: "Reboot required for auditd to apply new rules as immutable set"
  changed_when: false
  failed_when: false
  notify: Change_requires_reboot

- name: Restart_auditd
  when: not system_is_container
  ansible.builtin.systemd_service:
    name: auditd
    state: restarted

# pam-auth-update regenerates /etc/pam.d/common-* from the profiles in
# ubtu24stig_pam_confd_dir. --enable is used rather than --force: --force overrides
# the safety check that refuses to discard manual edits to the generated files, and
# discarding those silently is exactly the behaviour these controls are moving away
# from. Where a profile is already enabled this is a no-op, so the tasks that need a
# regeneration on a drifted host notify the handler explicitly instead.
- name: Pam_auth_update_pwunix
  ansible.builtin.command: pam-auth-update --enable {{ ubtu24stig_pam_pwunix_file }}
  changed_when: true

- name: Pam_auth_update_pwfaillock
  ansible.builtin.command: pam-auth-update --enable {{ ubtu24stig_pam_faillock_file }}
  changed_when: true

- name: Pam_auth_update_pwfaildelay
  ansible.builtin.command: pam-auth-update --enable {{ ubtu24stig_pam_faildelay_file }}
  changed_when: true

- name: Pam_auth_update_pwquality
  ansible.builtin.command: pam-auth-update --enable {{ ubtu24stig_pam_pwquality_file }}
  changed_when: true
