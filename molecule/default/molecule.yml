---
# Molecule configuration
# https://molecule.readthedocs.io/en/latest/

dependency:
  name: galaxy
  options:
    requirements-file: collections/requirements.yml
driver:
  name: docker

platforms:
  - name: ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    # The image is multi-arch. Default keeps local Apple Silicon runs on arm64;
    # CI exports MOLECULE_DOCKER_PLATFORM=linux/amd64 because its runners are amd64.
    platform: "${MOLECULE_DOCKER_PLATFORM:-linux/arm64}"
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    command: "/lib/systemd/systemd"
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
      # Resolve the role itself by name (basename of MOLECULE_PROJECT_DIRECTORY).
      # Ansible default search path doesn't include the role's parent dir, so
      # include_role by the role's own directory name fails without this hint.
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/molecule/default/roles"
  inventory:
    host_vars:
      ubuntu2404:
        ansible_become: false
        setup_audit: true
        run_audit: true
        fetch_audit_output: true
        # Files land one level above the role repo (working dir root), e.g.
        # `<working_dir>/_temp_fetched_audits/`. Override with `-e audit_output_destination=...`.
        audit_output_destination: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../_temp_fetched_audits/"

verifier:
  name: ansible
