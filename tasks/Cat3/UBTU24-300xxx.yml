---

- name: LOW | UBTU-24-300001 | PATCH | Ubuntu 24.04 LTS must be configured so that the Advance Package Tool (APT) prevents the installation of patches, service packs, device drivers, or operating system components without verification they have been digitally signed using a certificate that is recognized and approved by the organization.
  when: ubtu24stig_300001
  tags:
    - UBTU-24-300001
    - CAT3
    - CCI-003992
    - SRG-OS-000366-GPOS-00153
    - SV-270695r1066574_rule
    - V-270695
    - NIST800-53R4_NA
    - apt
  block:
    - name: LOW | UBTU-24-300001 | AUDIT | Ubuntu 24.04 LTS must be configured so that the Advance Package Tool (APT) prevents the installation of patches, service packs, device drivers, or operating system components without verification they have been digitally signed using a certificate that is recognized and approved by the organization.
      when: "'/etc/apt/apt.conf.d/01-vendor-ubuntu' in item"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: ^(APT::Get::AllowUnauthenticated "true";)
        replace: '#\1'
      loop: "{{ prelim_apt_conf_files.files }}"

    - name: LOW | UBTU-24-300001 | AUDIT | Ubuntu 24.04 LTS must be configured so that the Advance Package Tool (APT) prevents the installation of patches, service packs, device drivers, or operating system components without verification they have been digitally signed using a certificate that is recognized and approved by the organization.
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/01-vendor-ubuntu
        regexp: APT::Get::AllowUnauthenticated "true";
        line: APT::Get::AllowUnauthenticated "false";

- name: LOW | UBTU-24-300017 | PATCH | Ubuntu 24.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt.
  when: ubtu24stig_300017
  tags:
    - UBTU-24-300017
    - CAT3
    - CCI-000366
    - SRG-OS-000480-GPOS-00226
    - SV-270706r1068361_rule
    - V-270706
    - NIST800-53R4_CM-6
    - account
    - pam
  block:
    - name: LOW | UBTU-24-300017 | AUDIT | Ubuntu 24.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. | check common-auth for pam_faildelay.so
      ansible.builtin.shell: |
        set -o pipefail
        grep -P -- '\bpam_faildelay\.so\b' /etc/pam.d/common-auth
      args:
        executable: "{{ ubtu24stig_shell_executable }}"
      changed_when: false
      failed_when: discovered_pam_faildelay_auth.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_pam_faildelay_auth

    # Priority 384 places this above the unix profile (256), so pam-auth-update emits the
    # faildelay line before pam_unix.so in common-auth. The previous lineinfile anchored on
    # "nullok" in the pam_unix line, which UBTU-24-300028 removes - the two controls were
    # order-coupled through the generated file. Ordering is now a property of the profile.
    - name: LOW | UBTU-24-300017 | PATCH | Ubuntu 24.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. | ensure faildelay profile
      ansible.builtin.template:
        src: "{{ ubtu24stig_pam_confd_dir }}{{ ubtu24stig_pam_faildelay_file }}.j2"
        dest: "/{{ ubtu24stig_pam_confd_dir }}{{ ubtu24stig_pam_faildelay_file }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      notify: Pam_auth_update_pwfaildelay

    - name: LOW | UBTU-24-300017 | PATCH | Ubuntu 24.04 LTS must enforce a delay of at least four seconds between logon prompts following a failed logon attempt. | force pam-auth-update when the entry is missing
      when: discovered_pam_faildelay_auth.stdout | length == 0
      ansible.builtin.debug:
        msg: "pam_faildelay.so is missing from /etc/pam.d/common-auth; forcing pam-auth-update."
      changed_when: true
      notify: Pam_auth_update_pwfaildelay
